<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAXIS - Webhook Dashboard</title>
    <!-- 트렌디하고 동글동글한 Jua 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        body {
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- 몽환적인 버블 이펙트 배경 --- */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rise 15s infinite ease-in;
            backdrop-filter: blur(2px);
        }
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 80px; height: 80px; left: 20%; animation-duration: 11s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 35%; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(4) { width: 100px; height: 100px; left: 50%; animation-duration: 14s; }
        .bubble:nth-child(5) { width: 35px; height: 35px; left: 65%; animation-duration: 9s; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 120px; height: 120px; left: 80%; animation-duration: 12s; animation-delay: 1s; }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* --- 네비게이션 & 햄버거 메뉴 --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 28px; font-weight: normal; letter-spacing: 2px; }
        
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }
        .hamburger div {
            width: 30px;
            height: 4px;
            background-color: #fff;
            border-radius: 5px;
            transition: 0.4s;
        }
        .hamburger.active div:nth-child(1) { transform: rotate(-45deg) translate(-7px, 7px); }
        .hamburger.active div:nth-child(2) { opacity: 0; }
        .hamburger.active div:nth-child(3) { transform: rotate(45deg) translate(-7px, -7px); }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100vh;
            background: rgba(15, 12, 41, 0.95);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding-top: 80px;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 999;
        }
        .sidebar.active { right: 0; }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 20px;
            font-size: 20px;
            transition: 0.3s;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar a:hover { background: rgba(255, 255, 255, 0.1); padding-left: 30px; color: #00f2fe; }

        /* --- 메인 컨텐츠 영역 --- */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        h1 { font-size: 36px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        input[type="text"]:focus { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
        
        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 242, 254, 0.6); }
        button:active { transform: translateY(1px); }

        /* --- 결과 출력 카드 --- */
        .result-card {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            text-align: left;
            border-left: 5px solid #00f2fe;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-item { margin-bottom: 10px; font-size: 18px; }
        .result-item span { color: #00f2fe; }

        /* 섹션 전환 로직을 위한 클래스 */
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body>

    <!-- 배경 버블 -->
    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <nav>
        <div class="logo">VAXIS PANEL</div>
        <div class="hamburger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </nav>

    <div class="sidebar" id="sidebar">
        <a href="#" onclick="switchPage('home')">🏠 홈화면</a>
        <a href="#" onclick="switchPage('webhook')">📡 보낸정보 확인하기</a>
    </div>

    <!-- 페이지 1: 홈 -->
    <div id="home" class="container page-section active">
        <h1>환영합니다</h1>
        <p style="font-size: 20px; line-height: 1.6; color: #ddd;">
            우측 상단의 메뉴를 터치하여<br>
            원하는 대시보드 기능을 이용해보세요.
        </p>
    </div>

    <!-- 페이지 2: 웹훅 확인 및 파트너 자동화 -->
    <div id="webhook" class="container page-section">
        <h1>보낸정보 확인하기</h1>
        <div class="input-group">
            <input type="text" id="webhookInput" placeholder="디스코드 웹훅 URL 입력..." autocomplete="off">
            <input type="text" id="partnerInput" placeholder="생성할 파트너명 입력..." autocomplete="off">
            <button onclick="checkWebhook()">파트너 자동생성 및 조회</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-item">🤝 생성된 파트너: <span id="resPartner"></span></div>
            <div class="result-item">📌 자동 채널명: <span id="resChannel"></span></div>
            <div class="result-item">🕒 최근 발송일: <span id="resDate"></span></div>
            <div class="result-item">⚠️ 발송 실패 서버: <span id="resFail"></span></div>
        </div>
    </div>

    <script>
        // 햄버거 메뉴 토글
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const hamburger = document.querySelector('.hamburger');
            sidebar.classList.toggle('active');
            hamburger.classList.toggle('active');
        }

        // 페이지(섹션) 전환 로직
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            toggleMenu(); // 메뉴 클릭 시 닫기
        }

        // API 연동: 웹훅 상태 조회 및 파트너 자동생성
        async function checkWebhook() {
            const urlInput = document.getElementById('webhookInput').value;
            const partnerInput = document.getElementById('partnerInput').value;
            const resultCard = document.getElementById('resultCard');

            if(!urlInput || !partnerInput) {
                alert("웹훅 URL과 파트너명을 모두 입력해주세요!");
                return;
            }

            try {
                const response = await fetch('/api/webhook_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        webhook_url: urlInput,
                        partner_name: partnerInput 
                    })
                });
                
                const data = await response.json();

                if(data.success) {
                    document.getElementById('resPartner').innerText = data.partner_name;
                    document.getElementById('resChannel').innerText = data.channel_name;
                    document.getElementById('resDate').innerText = data.last_sent;
                    document.getElementById('resFail').innerText = data.failed_servers;
                    
                    resultCard.style.display = 'block';
                } else {
                    alert(data.error || "오류가 발생했습니다.");
                }
            } catch (err) {
                alert("서버와 통신할 수 없습니다.");
            }
        }
    </script>
</body>
</html>
