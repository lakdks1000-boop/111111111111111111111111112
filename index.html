<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파트너봇 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #313338; color: white; display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 400px; background-color: #2b2d31; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .preview-area { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        
        h2 { color: #f2f3f5; margin-top: 0; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #b5bac1; font-size: 14px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; background-color: #1e1f22; border: none; border-radius: 4px; color: white; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button.save-btn { margin-top: 20px; width: 100%; padding: 12px; background-color: #5865f2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background-color 0.2s; }
        button.save-btn:hover { background-color: #4752c4; }

        /* Discord Embed Preview Styles */
        .discord-embed { background-color: #2b2d31; border-left: 4px solid #1e1f22; border-radius: 4px; padding: 16px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .embed-title { font-weight: bold; margin-bottom: 8px; color: #f2f3f5; font-size: 16px; }
        .embed-desc { font-size: 14px; color: #dbdee1; white-space: pre-wrap; margin-bottom: 16px; line-height: 1.4; }
        .embed-btn { display: inline-block; background-color: #5865f2; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; }
        .embed-footer { font-size: 12px; color: #949ba4; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>패널 설정</h2>
        
        <label>임베드 제목</label>
        <input type="text" id="input_title" value="최상급 부스트 | 파트너 생성 패널" oninput="updatePreview()">
        
        <label>임베드 내용</label>
        <textarea id="input_desc" oninput="updatePreview()">버튼을 눌러 파트너 채널 생성을 시작하세요.</textarea>
        
        <label>버튼 텍스트</label>
        <input type="text" id="input_btn" value="생성하기" oninput="updatePreview()">

        <label>파트너에게 보낼 메시지 (웹훅 내용)</label>
        <textarea id="input_webhook_msg">서버에 파트너 봇이 성공적으로 연결되었습니다!</textarea>

        <label>메시지 전송 주기 (분)</label>
        <input type="number" id="input_interval" value="60">

        <button class="save-btn" onclick="saveSettings()">설정 저장 (DB 백업 트리거)</button>
    </div>

    <div class="preview-area">
        <h2 style="align-self: flex-start; margin-bottom: 30px;">실시간 프리뷰 (Discord UI)</h2>
        
        <div class="discord-embed">
            <div class="embed-title" id="preview_title">최상급 부스트 | 파트너 생성 패널</div>
            <div class="embed-desc" id="preview_desc">버튼을 눌러 파트너 채널 생성을 시작하세요.</div>
            <div class="embed-btn" id="preview_btn">생성하기</div>
            <div class="embed-footer">CopyRight 2026. 서버 이름. All rights reserved.</div>
        </div>
    </div>

    <script>
        function updatePreview() {
            document.getElementById('preview_title').innerText = document.getElementById('input_title').value;
            document.getElementById('preview_desc').innerText = document.getElementById('input_desc').value;
            document.getElementById('preview_btn').innerText = document.getElementById('input_btn').value;
        }

        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            if(data.title) {
                document.getElementById('input_title').value = data.title;
                document.getElementById('input_desc').value = data.description;
                document.getElementById('input_btn').value = data.button_text;
                document.getElementById('input_webhook_msg').value = data.webhook_message;
                document.getElementById('input_interval').value = data.interval_minutes;
                updatePreview();
            }
        }

        async function saveSettings() {
            const data = {
                title: document.getElementById('input_title').value,
                description: document.getElementById('input_desc').value,
                button_text: document.getElementById('input_btn').value,
                webhook_message: document.getElementById('input_webhook_msg').value,
                interval_minutes: parseInt(document.getElementById('input_interval').value)
            };
            
            const res = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if(res.ok) {
                alert('설정이 저장되었으며 백업 채널로 DB 파일이 전송됩니다.');
            }
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
