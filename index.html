<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파트너 봇 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #313338; color: #dbdee1; margin: 0; display: flex; height: 100vh; }
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; }
        .login-btn { background-color: #5865f2; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; transition: 0.2s; }
        .login-btn:hover { background-color: #4752c4; }

        .sidebar { width: 350px; background-color: #2b2d31; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; box-sizing: border-box; }
        .main-content { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; background-color: #313338; }

        h2 { color: #f2f3f5; margin-top: 0; font-size: 20px; border-bottom: 1px solid #1e1f22; padding-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #b5bac1; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 10px; background-color: #1e1f22; border: 1px solid #1e1f22; border-radius: 4px; color: #dbdee1; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #5865f2; }
        textarea { resize: vertical; height: 90px; }

        button.save-btn { width: 100%; padding: 12px; background-color: #5865f2; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button.save-btn:hover { background-color: #4752c4; }

        .preview-title { font-size: 18px; color: #f2f3f5; font-weight: bold; margin-bottom: 30px; align-self: flex-start; }
        .discord-msg-container { display: flex; align-items: flex-start; width: 100%; max-width: 550px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2; margin-right: 16px; flex-shrink: 0; }
        .msg-content { flex: 1; }
        .author-name { color: #f2f3f5; font-weight: 500; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .bot-tag { background-color: #5865f2; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        
        .discord-embed { background-color: #2b2d31; border-left: 4px solid #1e1f22; border-radius: 4px; padding: 16px; margin-top: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .embed-title { font-weight: 600; margin-bottom: 8px; color: #f2f3f5; font-size: 16px; }
        .embed-desc { font-size: 14px; color: #dbdee1; white-space: pre-wrap; margin-bottom: 16px; line-height: 1.5; }
        .embed-btn { display: inline-block; background-color: #5865f2; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; color: white; user-select: none; }
        .embed-footer { font-size: 12px; color: #949ba4; margin-top: 16px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #23a559; color: #fff; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 1; bottom: 30px; right: 30px; font-size: 15px; font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    {% if not logged_in %}
    <div class="login-container">
        <h1 style="color: white; margin-bottom: 30px;">파트너 봇 웹 패널</h1>
        <a href="{{ oauth_url }}" class="login-btn">Discord로 로그인하여 관리하기</a>
    </div>
    {% else %}
    <div class="sidebar">
        <h2>서버 설정</h2>
        
        <div class="form-group">
            <label>관리 중인 서버 선택</label>
            <select id="server_select" onchange="loadServerSettings()">
                <option value="">서버를 불러오는 중...</option>
            </select>
        </div>

        <div id="settings_panel" style="display: none;">
            <div class="form-group">
                <label>임베드 제목</label>
                <input type="text" id="input_title" oninput="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>임베드 내용 (\n으로 줄바꿈)</label>
                <textarea id="input_desc" oninput="updatePreview()"></textarea>
            </div>
            
            <div class="form-group">
                <label>버튼 텍스트</label>
                <input type="text" id="input_btn" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>웹훅 메시지 내용 (파트너 전송용)</label>
                <textarea id="input_webhook_msg"></textarea>
            </div>

            <div class="form-group">
                <label>자동 전송 주기 (분)</label>
                <input type="number" id="input_interval" min="1">
            </div>

            <button class="save-btn" onclick="saveSettings()">설정 저장 및 DB 백업</button>
        </div>
    </div>

    <div class="main-content">
        <div class="preview-title">실시간 디스코드 프리뷰</div>
        
        <div class="discord-msg-container">
            <div class="avatar"></div>
            <div class="msg-content">
                <div class="author-name">파트너봇 <span class="bot-tag">APP</span></div>
                
                <div class="discord-embed">
                    <div class="embed-title" id="preview_title">제목</div>
                    <div class="embed-desc" id="preview_desc">내용</div>
                    <div class="embed-btn" id="preview_btn">버튼</div>
                    <div class="embed-footer" id="preview_footer">CopyRight 2026. 서버 이름. All rights reserved.</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast">✅ 설정이 저장되고 파일이 백업되었습니다.</div>

    <script>
        let currentGuildId = null;
        let currentGuildName = "";

        async function init() {
            const res = await fetch('/api/guilds');
            const guilds = await res.json();
            const select = document.getElementById('server_select');
            select.innerHTML = '<option value="">서버를 선택하세요</option>';
            
            guilds.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                select.appendChild(opt);
            });
        }

        async function loadServerSettings() {
            const select = document.getElementById('server_select');
            currentGuildId = select.value;
            currentGuildName = select.options[select.selectedIndex].text;

            if (!currentGuildId) {
                document.getElementById('settings_panel').style.display = 'none';
                return;
            }

            const res = await fetch(`/api/settings/${currentGuildId}`);
            const data = await res.json();
            
            document.getElementById('input_title').value = data.title;
            document.getElementById('input_desc').value = data.description.replace(/\\n/g, '\n');
            document.getElementById('input_btn').value = data.button_text;
            document.getElementById('input_webhook_msg').value = data.webhook_message;
            document.getElementById('input_interval').value = data.interval_minutes;
            
            document.getElementById('settings_panel').style.display = 'block';
            updatePreview();
        }

        function updatePreview() {
            document.getElementById('preview_title').innerText = document.getElementById('input_title').value;
            document.getElementById('preview_desc').innerText = document.getElementById('input_desc').value.replace(/\\n/g, '\n');
            document.getElementById('preview_btn').innerText = document.getElementById('input_btn').value;
            document.getElementById('preview_footer').innerText = `CopyRight 2026. ${currentGuildName}. All rights reserved.`;
        }

        async function saveSettings() {
            if (!currentGuildId) return;

            const data = {
                title: document.getElementById('input_title').value,
                description: document.getElementById('input_desc').value.replace(/\n/g, '\\n'),
                button_text: document.getElementById('input_btn').value,
                webhook_message: document.getElementById('input_webhook_msg').value,
                interval_minutes: parseInt(document.getElementById('input_interval').value)
            };
            
            const res = await fetch(`/api/settings/${currentGuildId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showToast();
            } else {
                alert("설정 저장에 실패했습니다. 권한을 확인해주세요.");
            }
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        window.onload = init;
    </script>
    {% endif %}
</body>
</html>
