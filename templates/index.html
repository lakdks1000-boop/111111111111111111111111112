<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAXIS - Partner Automation Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body {
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: #fff; overflow-x: hidden; min-height: 100vh;
        }
        .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .bubble {
            position: absolute; bottom: -100px; background: rgba(255, 255, 255, 0.15);
            border-radius: 50%; animation: rise 15s infinite ease-in; backdrop-filter: blur(2px);
        }
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 80px; height: 80px; left: 25%; animation-duration: 11s; }
        .bubble:nth-child(3) { width: 60px; height: 60px; left: 50%; animation-duration: 7s; }
        .bubble:nth-child(4) { width: 90px; height: 90px; left: 75%; animation-duration: 13s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 28px; letter-spacing: 2px; color: #00f2fe; }
        .user-box { display: flex; align-items: center; gap: 15px; }
        .user-box img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #00f2fe; }
        .login-btn, .logout-btn {
            padding: 10px 20px; border-radius: 20px; text-decoration: none; color: white;
            background: #5865F2; transition: 0.3s; font-size: 16px;
        }
        .logout-btn { background: #ed4245; }
        .login-btn:hover, .logout-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        .container {
            max-width: 900px; margin: 40px auto; padding: 40px;
            background: rgba(255, 255, 255, 0.05); border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        }
        h1 { font-size: 34px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; text-align: left; }
        label { font-size: 16px; color: #00f2fe; margin-left: 10px; }
        input[type="text"], textarea, select {
            width: 100%; padding: 15px 25px; border-radius: 20px; border: none; outline: none;
            font-size: 16px; background: rgba(255,255,255,0.1); color: #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s;
        }
        textarea { resize: vertical; min-height: 100px; }
        select option { background: #24243e; color: #fff; }
        input:focus, textarea:focus, select:focus { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
        
        button {
            width: 100%; padding: 15px; border: none; border-radius: 30px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white; font-size: 18px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); margin-top: 10px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 242, 254, 0.6); }

        .discord-preview {
            background: #313338; border-radius: 8px; padding: 15px; text-align: left;
            margin-top: 25px; border-left: 4px solid #5865F2; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .discord-header { font-size: 14px; color: #949ba4; margin-bottom: 8px; }
        .discord-content { font-size: 15px; color: #dbdee1; white-space: pre-wrap; word-break: break-all; }

        .result-card {
            display: none; margin-top: 25px; padding: 25px; background: rgba(0, 0, 0, 0.4);
            border-radius: 15px; text-align: left; border-left: 5px solid #00f2fe;
        }
        .result-item { margin-bottom: 10px; font-size: 18px; }
        .result-item span { color: #00f2fe; }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <nav>
        <div class="logo">VAXIS PANEL</div>
        <div class="user-box">
            {% if user %}
                <img src="{{ user.avatar }}" alt="Avatar">
                <span>{{ user.username }}님</span>
                <a href="/logout" class="logout-btn">로그아웃</a>
            {% else %}
                <a href="/login" class="login-btn">Discord 로그인</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <h1>파트너 자동생성 및 주기적 메시지 관리</h1>
        {% if user %}
        <div class="input-group">
            <label>정보웹훅입력</label>
            <input type="text" id="webhookInput" placeholder="디스코드 정보웹훅 URL을 입력하세요..." autocomplete="off">
            
            <label>파트너명 입력</label>
            <input type="text" id="partnerInput" placeholder="생성할 파트너명을 입력하세요..." autocomplete="off">
            
            <label>파트너에게 보낼 메시지 (특수문자/이모지/줄바꿈 지원)</label>
            <textarea id="messageInput" placeholder="보낼 내용을 자유롭게 적어주세요 (특수문자 및 줄바꿈 완벽 지원)..." oninput="updatePreview(this.value)"></textarea>

            <label>발송 시간 주기 설정</label>
            <select id="intervalInput">
                <option value="0.5">30분 주기</option>
                <option value="1">1시간 주기</option>
                <option value="6">6시간 주기</option>
                <option value="12">12시간 주기</option>
                <option value="24" selected>24시간 주기 (기본)</option>
            </select>

            <button onclick="checkWebhook()">파트너 자동생성 및 자동발송 시작</button>
        </div>

        <!-- 실시간 디스코드 채팅 프리뷰 -->
        <div class="discord-preview">
            <div class="discord-header">💬 실시간 디스코드 채팅창 미리보기</div>
            <div class="discord-content" id="previewContent">메시지를 입력하면 실시간으로 여기에 표시됩니다...</div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-item">🤝 파트너명: <span id="resPartner"></span></div>
            <div class="result-item">📌 자동 채널명: <span id="resChannel"></span></div>
            <div class="result-item">⏱️ 발송 주기: <span id="resInterval"></span></div>
            <div class="result-item">🕒 최초 발송일: <span id="resDate"></span></div>
        </div>
        {% else %}
        <p style="font-size: 20px; color: #ff6b6b; margin-top: 20px;">
            ⚠️ 기능을 이용하려면 우측 상단에서 <b>Discord 로그인</b>을 먼저 진행해주세요!
        </p>
        {% endif %}
    </div>

    <script>
        function updatePreview(val) {
            const preview = document.getElementById('previewContent');
            if(val.trim() === "") {
                preview.innerText = "메시지를 입력하면 실시간으로 여기에 표시됩니다...";
            } else {
                preview.innerText = val;
            }
        }

        async function checkWebhook() {
            const webhook_url = document.getElementById('webhookInput').value;
            const partner_name = document.getElementById('partnerInput').value;
            const message_content = document.getElementById('messageInput').value;
            const interval_hours = document.getElementById('intervalInput').value;
            const resultCard = document.getElementById('resultCard');

            if(!webhook_url || !partner_name || !message_content) {
                alert("모든 필드를 빠짐없이 입력해주세요!");
                return;
            }

            try {
                const response = await fetch('/api/webhook_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ webhook_url, partner_name, message_content, interval_hours })
                });
                
                const data = await response.json();

                if(response.status === 401) {
                    alert("로그인이 만료되었거나 필요합니다.");
                    location.href = '/login';
                    return;
                }

                if(data.success) {
                    document.getElementById('resPartner').innerText = data.partner_name;
                    document.getElementById('resChannel').innerText = data.channel_name;
                    document.getElementById('resInterval').innerText = data.interval_text;
                    document.getElementById('resDate').innerText = data.last_sent;
                    resultCard.style.display = 'block';
                    alert("성공적으로 웹훅이 연동되었으며 즉시 1회 발송 및 주기적 자동발송이 시작되었습니다!");
                } else {
                    alert(data.error || "오류가 발생했습니다.");
                }
            } catch (err) {
                alert("서버와 통신할 수 없습니다.");
            }
        }
    </script>
</body>
</html>
